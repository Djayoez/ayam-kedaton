backend:
  name: git-gateway
  branch: main

media_folder: "assets"
public_folder: "/assets"

collections:
  - name: "home"
    label: "Home"
    files:
      - file: "content/home.json"
        label: "Home Content"
        name: "home"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "headline", widget: "text" }
          - { label: "Subheading", name: "sub", widget: "text" }
          - { label: "Image", name: "image", widget: "image" }

  - name: "menu"
    label: "Menu"
    files:
      - file: "content/menu.json"
        label: "Menu Items"
        name: "menu"
        fields:
          - { label: "Items", name: "items", widget: "list", fields: [
              { label: "Name", name: "name", widget: "string" },
              { label: "Description", name: "description", widget: "text" },
              { label: "Price", name: "price", widget: "string" },
              { label: "Image", name: "image", widget: "image" }
            ] }

  - name: "testimonials"
    label: "Testimonials"
    files:
      - file: "content/testimonials.json"
        label: "Testimonials"
        name: "testimonials"
        fields:
          - { label: "Items", name: "items", widget: "list", fields: [
              { label: "Author", name: "author", widget: "string" },
              { label: "Text", name: "text", widget: "text" }
            ] }
